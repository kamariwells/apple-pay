<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Body Work Lab | Client Payments</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:#00283d;color:#fff}
.page{
  position:relative;isolation:isolate;overflow:hidden;
  max-width:480px;min-height:100vh;min-height:956px;
  margin:auto;text-align:center;
  background:
    radial-gradient(ellipse at 50% 0%,#c6faff 0%,#45cce9 7%,transparent 25%),
    radial-gradient(ellipse at 15% 15%,#168bad,transparent 38%),
    radial-gradient(ellipse at 85% 20%,#087b9b,transparent 42%),
    linear-gradient(180deg,#168bb0,#04536f 48%,#002238 100%);
}
.water{
  position:absolute;z-index:-1;inset:0;
  background:
    repeating-radial-gradient(ellipse at 50% -12%,transparent 0 12px,#d7faff30 14px,transparent 18px),
    repeating-linear-gradient(175deg,transparent 0 5px,#e1faff0b 6px,transparent 9px);
}
.rays{
  position:absolute;z-index:-1;inset:0;
  background:repeating-conic-gradient(from 245deg at 50% 0%,transparent 0deg,#d9faff20 4deg,transparent 9deg);
  filter:blur(8px);
}
.depth{
  position:absolute;z-index:-1;bottom:0;width:100%;height:35%;
  background:
    radial-gradient(ellipse at 0% 100%,#0084a399,transparent 45%),
    radial-gradient(ellipse at 100% 100%,#00678588,transparent 45%),
    linear-gradient(0deg,#001725f5,transparent);
}
.content{position:relative;min-height:956px;padding:1px 20px}
.logo{margin-top:32px;font-size:19px;font-weight:300;letter-spacing:17px;padding-left:17px}
.brand{margin-top:320px}
h1{font-size:clamp(43px,11vw,58px);line-height:1.04;letter-spacing:-2px;margin:0;font-weight:700}
.tagline{font-size:clamp(18px,5vw,24px);font-weight:300;margin:35px 0 0;white-space:nowrap}
.payment{position:absolute;top:72%;left:0;width:100%;padding:0 5%}
.label{font-size:14px;letter-spacing:9px;padding-left:9px;margin-bottom:30px;white-space:nowrap}
.pay{
  display:flex;align-items:center;justify-content:center;gap:17px;
  width:100%;min-height:94px;border:2px solid #fff;border-radius:100px;
  color:white;text-decoration:none;background:#ffffff12;
  box-shadow:0 0 22px #d5faff20;
}
.pay span{font-size:clamp(22px,6vw,29px);font-weight:600;letter-spacing:5px;white-space:nowrap}
.apple{width:36px;height:42px;fill:white;flex-shrink:0}
.footer{margin-top:28px;font-size:12px;letter-spacing:5px;white-space:nowrap}
.bubble{position:absolute;border:1px solid #c8f8ff8c;border-radius:50%;box-shadow:0 0 10px #baf4ff77}
.b1{width:8px;height:8px;top:64%;left:13%}
.b2{width:14px;height:14px;top:68%;right:9%}
.b3{width:19px;height:19px;top:85%;left:5%}
.b4{width:7px;height:7px;top:89%;right:15%}
@media(max-width:370px){
 .brand{margin-top:285px}
 .payment{padding:0 4%}
 .label{letter-spacing:6px}
 .pay{gap:10px;min-height:82px}
 .pay span{letter-spacing:3px}
 .footer{letter-spacing:3px;font-size:10px}
}
</style>
</head>
<body>
<main class="page">
  <div class="water"></div>
  <div class="rays"></div>
  <div class="depth"></div>
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>

  <div class="content">
    <div class="logo">T B L</div>

    <section class="brand">
      <h1>The Body<br>Work Lab</h1>
      <p class="tagline">Your experience starts here.</p>
    </section>

    <section class="payment">
      <div class="label">CLIENT PAYMENTS</div>
      <a class="pay"
         href="sms:+12134556794?body=Hi%21%20I%27d%20like%20to%20take%20care%20of%20my%20TBL%20service%20payment%20through%20Apple%20Cash."
         aria-label="Arrange payment through Apple Cash">
        <span>APPLE CASH</span>
        <svg class="apple" viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M19.7 14.9c0-3.2 2.6-4.7 2.7-4.8a5.9 5.9 0 0 0-4.6-2.5c-1.9-.2-3.7 1.1-4.7 1.1-1 0-2.5-1.1-4.1-1.1A6.1 6.1 0 0 0 3.8 11c-2.2 3.8-.6 9.4 1.5 12.5 1 1.5 2.2 3.1 3.7 3.1 1.5-.1 2.1-1 4-1s2.5 1 4 1 2.6-1.5 3.6-3a13 13 0 0 0 1.6-3.3 5.5 5.5 0 0 1-2.5-5.4ZM16.6 5.5A5.8 5.8 0 0 0 18 1.3a5.9 5.9 0 0 0-3.8 2 5.4 5.4 0 0 0-1.4 4 5 5 0 0 0 3.8-1.8Z"/>
        </svg>
      </a>
      <div class="footer">TAP TO ARRANGE PAYMENT</div>
    </section>
  </div>
</main>
</body>
</html>
